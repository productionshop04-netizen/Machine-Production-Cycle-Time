
      - name: Fix Android project folder structure
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/liugong/machineproductioncycletime
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/liugong/machineproductioncycletime/MainActivity.java
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f ic_app_logo.xml ]; then
            mv ic_app_logo.xml app/src/main/res/drawable/ic_app_logo.xml
          fi

          if [ -f strings.xml ]; then
            mv strings.xml app/src/main/res/values/strings.xml
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.liugong.machineproductioncycletime'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.liugong.machineproductioncycletime'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          fi
