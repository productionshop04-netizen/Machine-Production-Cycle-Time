
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Machine Production Cycle Time
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Android project folder structure
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/liugong/machineproductioncycletime
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/liugong/machineproductioncycletime/
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          if [ -f ic_app_logo.xml ]; then
            mv ic_app_logo.xml app/src/main/res/drawable/
          fi

          if [ -f strings.xml ]; then
            mv strings.xml app/src/main/res/values/
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/
          fi

          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.liugong.machineproductioncycletime'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.liugong.machineproductioncycletime'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          fi

      - name: Check Android project
        run: |
          ls -la
          ls -la app
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/liugong/machineproductioncycletime/MainActivity.java

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Production-Cycle-Time-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
